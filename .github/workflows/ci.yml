name: CI

# Extracted straight from docs/guide/release-workflow.md Step 1: the
# deterministic tier and the docs build run on every push/PR so those gates
# are enforced rather than trusted. The live tier and orphaned-process check
# (Steps 0/3) need a real Siri + Apple Intelligence machine and stay manual —
# see the release-workflow guide for the pre-tag checklist a release host
# runs on hardware.

on:
  push:
    branches: [main]
  pull_request:

# Gated tests: the deterministic tier never sets LIVE_TESTS, so CI runs it
# fully offline green — no Siri session, no Apple Intelligence needed.
env:
  LIVE_TESTS: "0"

jobs:
  deterministic-tier:
    name: build + tests (deterministic tier)
    # Swift 6.4 toolchain: the macos-26 GA image ships SwiftPM 6.3.3 (Xcode
    # 26.6), which rejects swift-tools-version 6.4 — the first CI run failed
    # on exactly that. The xcode-27 image carries the 6.4 toolchain (public
    # preview; swap to the GA equivalent when it ships).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  docs-build:
    name: docs (vitepress build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Docs build
        working-directory: docs
        run: npm ci && npm run build
